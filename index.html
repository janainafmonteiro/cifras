<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Meio Termo — cifras na sua medida</title>
<style>
:root{--paper:#F4F6F8;--card:#fff;--ink:#17202E;--mute:#5E6B7D;--line:#D9DFE7;--s:#0E8A7D;--i:#3156D3;--a:#B5179E;--fs:14px}
@media(prefers-color-scheme:dark){:root{--paper:#10151D;--card:#18202B;--ink:#E8EDF4;--mute:#93A1B5;--line:#2A3544;--s:#3CC9B8;--i:#7C9BFF;--a:#F06CD9}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;margin:0;line-height:1.2}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
a{color:var(--i)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--i);outline-offset:2px}
button.primary{background:var(--i);border-color:var(--i);color:#fff;font-weight:600}
button.ghost{border-color:transparent;background:none;color:var(--mute)}
button.danger{color:#C62828}
button:disabled{opacity:.6;cursor:wait}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute);font-size:14px}
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input[type=text],input[type=password],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:200px;white-space:pre;overflow:auto}
.song{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px}
.song b{font-family:Georgia,serif;font-size:18px}
.empty{padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--mute)}
.sec{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--vc);border-radius:10px;margin:14px 0;padding:12px 14px}
.sec header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;min-height:36px;font-size:14px;background:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--c);color:#fff;font-weight:600}
pre{margin:0;overflow-x:auto;font:var(--fs)/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:4}
pre b{color:var(--vc);font-weight:700}
.sec textarea{min-height:160px}
.status{margin-top:12px;padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:14px}
.status.err{border-color:#C62828;color:#C62828}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.tabs{flex-wrap:wrap}
.tabs label{padding:8px 12px;cursor:pointer;background:var(--card)}
.tabs input{position:absolute;opacity:0}
.tabs input:checked+span{font-weight:700;text-decoration:underline;text-decoration-color:var(--i);text-underline-offset:4px}
.tabs label:has(input:focus-visible){outline:2px solid var(--i)}
@media(max-width:520px){.seg button{padding:6px 8px;font-size:13px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app');
const L = {simple:'Simples', intermediate:'Intermediária', advanced:'Avançada'};
const VAR = {simple:'--s', intermediate:'--i', advanced:'--a'};
const KEYS = ['simple','intermediate','advanced'];
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
let db = load('meiotermo.songs', {songs:[]});
let cfg = {provider:'gemini', key:'', model:'claude-sonnet-4-6', gkey:'', gmodel:'gemini-flash-latest', gsearch:false, sheet:'', fs:14, ...load('meiotermo.cfg', {})};
const canSearch = () => cfg.provider === 'anthropic' || cfg.gsearch;
const saveDb = () => localStorage.setItem('meiotermo.songs', JSON.stringify(db));
const saveCfg = () => localStorage.setItem('meiotermo.cfg', JSON.stringify(cfg));
document.documentElement.style.setProperty('--fs', cfg.fs + 'px');
let editing = null;

/* ---------- cifra: detecta linhas de acordes e destaca ---------- */
const CHORD = /^[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|°|º|\+)?(?:(?:sus|add|maj|b|#|\+|-)?[0-9]+M?\+?)*(?:\([^)]*\))?(?:\/[A-G][#b]?)?$/;
const FILL = /^(\||x\d+|-+|\.+|\/)$/;
function isChordLine(l) {
  const t = l.trim().split(/\s+/);
  return l.trim() !== '' && t.every(w => CHORD.test(w) || FILL.test(w)) && t.some(w => CHORD.test(w));
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => (t || '').split('\n').map(l => isChordLine(l) ? esc(l).replace(/\S+/g, m => `<b>${m}</b>`) : esc(l)).join('\n');

/* ---------- sem IA: simplifica por regras, mantendo o alinhamento ---------- */
function simp(tok, lvl) {
  const m = tok.match(/^([A-G][#b]?)(.*?)(?:\/[A-G][#b]?)?$/); if (!m) return tok;
  const root = m[1]; let rest = m[2];
  const minor = /^(m(?!aj)|min|dim|°|º)/.test(rest);
  if (lvl === 'simple') return root + (minor ? 'm' : '');
  if (/^(m7\(?b5\)?|ø)/.test(rest)) return root + 'm7b5';
  if (/^(dim|°|º)/.test(rest)) return root + 'dim';
  const sus = rest.match(/^sus[24]?/); if (sus) return root + sus[0];
  const base = /^(m(?!aj)|min)/.test(rest) ? 'm' : '';
  const tail = rest.replace(/^(m(?!aj)|min)/, '').replace(/\(.*?\)/g, '').replace(/^7M/, 'maj7');
  if (/^(maj|M)(7|9|11|13)/.test(tail)) return root + base + 'maj7';
  if (/^(7|9|11|13)/.test(tail)) return root + base + '7';
  return root + base;
}
function derive(text, lvl) {
  return text.split('\n').map(l => !isChordLine(l) ? l : l.replace(/(\S+)(\s*)/g, (m, t, sp) => {
    if (!CHORD.test(t)) return m;
    const n = simp(t, lvl);
    return n + ' '.repeat(Math.max(m.length - n.length, sp ? 1 : 0));
  })).join('\n');
}
function parseSections(text) {
  const lines = text.replace(/\r/g, '').split('\n'), out = [];
  let cur = null;
  const push = () => { if (cur) { cur.t = cur.t.join('\n').replace(/^\n+|\s+$/g, ''); if (cur.t) out.push(cur); } };
  if (lines.some(l => /^\s*\[[^\]]+\]/.test(l))) {
    for (const l of lines) {
      const m = l.match(/^\s*\[([^\]]+)\](.*)$/);
      if (m) { push(); cur = {name: m[1].trim(), t: m[2].trim() ? [m[2].trim()] : []}; }
      else { if (!cur) cur = {name: 'Início', t: []}; cur.t.push(l); }
    }
    push();
  } else {
    text.replace(/\r/g, '').split(/\n\s*\n/).forEach((t, i) => { cur = {name: 'Trecho ' + (i + 1), t: [t]}; push(); });
  }
  return out;
}
function genOffline() {
  const st = $('#st'); st.hidden = false;
  const q = $('#q').value.trim(), ts = $('#t-s').value.trim(), ta = $('#t-a').value.trim();
  const fail = m => { st.className = 'status err'; st.textContent = m; };
  if (!q) return fail('Digite o nome da música.');
  if (!ts && !ta) return fail('Cole pelo menos uma das versões.');
  const A = parseSections(ta || ts), S = ts && ta ? parseSections(ts) : null;
  if (!A.length) return fail('Não encontrei trechos no texto colado.');
  const useS = S && S.length === A.length;
  if (S && !useS) alert('Não consegui casar os trechos da simplificada com os da avançada, então a simplificada foi gerada a partir da avançada.');
  const song = {id: Date.now().toString(36), title: q, artist: '', key: '', instrument: document.querySelector('[name=inst]:checked').value, created: Date.now(),
    sections: A.map((x, i) => ({name: x.name, sel: 'intermediate', v: {simple: useS ? S[i].t : derive(x.t, 'simple'), intermediate: derive(x.t, 'inter'), advanced: x.t}}))};
  db.songs.unshift(song); saveDb(); nav('#/song/' + song.id);
}

/* ---------- importar do chat / planilha ---------- */
const slug = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const noAcc = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function parseChat(text) {
  const L = text.replace(/\r/g, '').split('\n').filter(l => !/^\s*```/.test(l));
  const meta = {}, secs = []; let sec = null, ver = null, m;
  for (const l of L) {
    if (!sec && (m = l.match(/^\s*\**\s*(T[IÍ]TULO|ARTISTA|TOM|INSTRUMENTO)\s*:\s*\**\s*(.*)$/i))) { meta[noAcc(m[1])] = m[2].replace(/\*+$/, '').trim(); continue; }
    if ((m = l.match(/^\s*==\s*(.+?)\s*==\s*$/))) { sec = {name: m[1], simple: [], intermediate: [], advanced: []}; secs.push(sec); ver = null; continue; }
    if (sec && (m = l.match(/^\s*---\s*(simples|intermedi[aá]ria|avan[cç]ada)\s*---\s*$/i))) { ver = /simples/i.test(m[1]) ? 'simple' : /intermedi/i.test(m[1]) ? 'intermediate' : 'advanced'; continue; }
    if (sec && ver) sec[ver].push(l);
  }
  secs.forEach(s => KEYS.forEach(k => s[k] = s[k].join('\n').replace(/^\n+|\s+$/g, '')));
  return {meta, secs: secs.filter(s => s.simple || s.intermediate || s.advanced)};
}
function parseCsv(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n') { r.push(c); rows.push(r); r = []; c = ''; }
    else if (ch !== '\r') c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  return rows;
}
function upsert(meta, secs) {
  const id = 'p-' + slug(meta.title + ' ' + (meta.artist || ''));
  let s = find(id);
  if (!s) { s = {id, created: Date.now(), sections: []}; db.songs.unshift(s); }
  Object.assign(s, {title: meta.title, artist: meta.artist || '', key: meta.key || '', instrument: /guitarra/i.test(meta.instrument || '') ? 'guitarra' : 'violao'});
  secs.forEach((n, i) => {
    let x = s.sections[i];
    if (!x) x = s.sections[i] = {name: n.name, sel: 'intermediate', v: {}};
    x.name = n.name; x.edited = x.edited || {}; x.src = {};
    KEYS.forEach(k => { const t = n[k] || n.intermediate || n.advanced || n.simple || ''; x.src[k] = t; if (!x.edited[k]) x.v[k] = t; });
  });
  s.sections.length = secs.length;
  return s;
}
function copyText(t) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Copiado.')).catch(() => prompt('Copie o texto abaixo:', t));
}
const FORMATO = `TITULO: nome da música
ARTISTA: nome do artista
TOM: tom original
INSTRUMENTO: violao
== Intro ==
--- simples ---
(acordes em cima da letra)
--- intermediaria ---
(acordes em cima da letra)
--- avancada ---
(acordes em cima da letra)
== Verso 1 ==
--- simples ---
...
(repita para todos os trechos: Verso, Refrão, Ponte, Solo...)`;
const REGRAS = `simples = acordes básicos e fáceis, sem pestana quando possível, sem extensões; avancada = harmonia completa e fiel à original (7ª, 9ª, sus, baixos invertidos); intermediaria = meio-termo (mantém a harmonia e a 7ª quando essencial, mas tira extensões raras e formas muito difíceis). A letra e a ordem dos trechos são iguais nas 3 versões, com os acordes alinhados em cima da sílaba, usando espaços.`;
function promptChat() {
  const q = $('#q')?.value.trim() || '[escreva aqui a música e o artista]';
  const inst = document.querySelector('[name=inst]:checked')?.value === 'guitarra' ? 'guitarra' : 'violão';
  return `Quero a cifra da música "${q}" para ${inst}. Pesquise a cifra simplificada e a avançada na internet (por exemplo no Cifra Club) e gere 3 versões de cada trecho: ${REGRAS}\n\nResponda SOMENTE com UM bloco de código neste formato exato:\n\n${FORMATO}`;
}
function promptSheet() {
  return `Crie uma planilha do Google Sheets chamada "Minhas cifras" com uma linha por trecho da música e estas colunas, nesta ordem: musica, artista, tom, instrumento, trecho, simples, intermediaria, avancada. Em "simples", "intermediaria" e "avancada" vai a cifra do trecho: linha de acordes em cima da linha da letra, alinhados com espaços, com quebras de linha dentro da célula. ${REGRAS}\nA primeira música é: [escreva aqui a música e o artista]. Pesquise as cifras na internet. Depois, quando eu pedir outra música, ACRESCENTE as linhas na mesma planilha, sem apagar as anteriores.`;
}
async function syncSheet(silent) {
  if (!cfg.sheet) return;
  const msg = m => { const e = $('#sync'); if (e) { e.hidden = false; e.textContent = m; } };
  try {
    const res = await fetch(cfg.sheet + (cfg.sheet.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error('A planilha respondeu com erro ' + res.status + '.');
    const txt = await res.text();
    if (/^\s*</.test(txt)) throw new Error('Esse link não é um CSV publicado. Use Arquivo > Compartilhar > Publicar na Web > CSV.');
    const rows = parseCsv(txt), hd = rows.shift().map(noAcc), col = n => hd.indexOf(n);
    const need = ['musica', 'trecho', 'simples', 'intermediaria', 'avancada'].filter(n => col(n) < 0);
    if (need.length) throw new Error('Faltam colunas na planilha: ' + need.join(', ') + '.');
    const g = (r, n) => col(n) < 0 ? '' : (r[col(n)] || '').replace(/\s+$/, '');
    const songs = new Map();
    rows.forEach(r => {
      const t = g(r, 'musica').trim(); if (!t) return;
      const k = t + '|' + g(r, 'artista').trim();
      if (!songs.has(k)) songs.set(k, {meta: {title: t, artist: g(r, 'artista').trim(), key: g(r, 'tom').trim(), instrument: g(r, 'instrumento')}, secs: []});
      songs.get(k).secs.push({name: g(r, 'trecho').trim() || 'Trecho', simple: g(r, 'simples'), intermediate: g(r, 'intermediaria'), advanced: g(r, 'avancada')});
    });
    songs.forEach(x => upsert(x.meta, x.secs)); saveDb();
    if (!location.hash || location.hash === '#/') home();
    msg('Planilha sincronizada: ' + songs.size + ' músicas.');
  } catch (e) { if (!silent) msg('Não consegui sincronizar. ' + (e.message === 'Failed to fetch' ? 'Verifique a internet e se o link está publicado como CSV.' : e.message)); }
}

/* ---------- IA ---------- */
const SYSTEM = `Você é um arranjador de cifras para violão e guitarra. Responda SEMPRE e SOMENTE com um objeto JSON válido (sem markdown, sem texto antes ou depois) neste formato:
{"title":"","artist":"","key":"tom original","sections":[{"name":"Intro","simple":"","intermediate":"","advanced":""}]}
Regras:
- Cada trecho (Intro, Verso, Refrão, Ponte, Solo...) tem 3 versões em formato de cifra: uma linha de acordes ACIMA da linha de letra, alinhada com a sílaba onde o acorde troca, usando espaços (texto monoespaçado). Use \\n para quebras de linha.
- A letra e a ordem dos trechos são idênticas nas 3 versões. Não reescreva nem invente letra; se não tiver certeza da letra, deixe só os acordes.
- simple: poucos acordes, formas abertas e fáceis, sem pestana quando possível, sem extensões (7, 9, sus viram a tríade).
- advanced: harmonia completa e fiel à versão original, com extensões, baixos invertidos, sus, add9 etc.
- intermediate: meio-termo entre as duas. Mantém a harmonia e a "cara" da música (por exemplo, mantém 7ª quando é essencial), mas tira extensões raras, inversões difíceis e formas muito esticadas; pestanas comuns são aceitáveis.
- Mantenha o mesmo tom nas 3 versões. Se usar capotraste, escreva na primeira linha do trecho Intro, ex: "Capotraste na 2ª casa".
- Para guitarra: simple pode usar power chords e tríades; advanced pode usar voicings mais ricos. Para violão: acordes de violão.`;

function pickJson(texts) {
  for (const t of texts.reverse()) {
    const a = t.indexOf('{'), z = t.lastIndexOf('}');
    if (a < 0 || z < a) continue;
    try { return JSON.parse(t.slice(a, z + 1)); } catch {}
  }
  throw new Error('A IA não devolveu um resultado legível. Tente de novo.');
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function ask(userText, search, note) {
  if (cfg.provider === 'gemini') {
    if (!cfg.gkey) throw new Error('Cadastre sua chave do Gemini em Configurações.');
    const body = {systemInstruction:{parts:[{text:SYSTEM}]}, contents:[{role:'user', parts:[{text:userText}]}], generationConfig:{maxOutputTokens:16000}};
    if (search) body.tools = [{google_search:{}}]; else body.generationConfig.responseMimeType = 'application/json';
    const models = [cfg.gmodel, 'gemini-flash-lite-latest'].filter((m, i, a) => a.indexOf(m) === i);
    let res, data;
    for (const m of models) {
      for (let t = 0; t < 3; t++) {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
          method:'POST', headers:{'content-type':'application/json','x-goog-api-key':cfg.gkey}, body: JSON.stringify(body)});
        data = await res.json().catch(() => ({}));
        if (res.ok || ![429, 500, 503, 504].includes(res.status)) break;
        note && note(`O Gemini está ocupado. Tentando de novo (${models.indexOf(m) * 3 + t + 1}/${models.length * 3})…`);
        await wait(2000 * 2 ** t);
      }
      if (res.ok) break;
    }
    if (!res.ok) throw new Error(([429, 500, 503, 504].includes(res.status) ? 'O Gemini está sobrecarregado ou sem cota agora. Tente de novo em alguns minutos ou use “Gerar sem IA”. ' : '') + (data.error?.message || 'Erro ' + res.status));
    const parts = data.candidates?.[0]?.content?.parts || [];
    return pickJson(parts.filter(p => p.text && !p.thought).map(p => p.text));
  }
  if (!cfg.key) throw new Error('Cadastre sua chave da API da Anthropic em Configurações.');
  const body = {model: cfg.model, max_tokens: 12000, system: SYSTEM, messages:[{role:'user', content:userText}]};
  if (search) body.tools = [{type:'web_search_20250305', name:'web_search', max_uses:6}];
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Erro ' + res.status);
  return pickJson(data.content.filter(b => b.type === 'text').map(b => b.text));
}

/* ---------- telas ---------- */
const find = id => db.songs.find(s => s.id === id);
function nav(h) { location.hash = h; }

function home() {
  app.innerHTML = `
  <div class="bar"><h1>Meio Termo</h1>
    <div class="row">${cfg.sheet ? '<button data-act="sync">Sincronizar</button>' : ''}<button class="ghost" data-act="go" data-to="#/cfg">Configurações</button><button class="primary" data-act="go" data-to="#/new">Nova música</button></div></div>
  <div id="sync" class="status" role="status" hidden></div>
  ${db.songs.length ? db.songs.map(s => `<button class="song" data-act="go" data-to="#/song/${s.id}"><b>${esc(s.title)}</b><br><span class="mute">${esc(s.artist || '')} ${s.artist ? '·' : ''} ${s.instrument === 'guitarra' ? 'Guitarra' : 'Violão'}, ${s.sections.length} trechos</span></button>`).join('')
  : `<div class="empty">Nenhuma música salva ainda.<br>Toque em “Nova música” e digite o nome da que você quer tocar.</div>`}`;
}

function newView() {
  app.innerHTML = `
  <div class="bar"><button class="ghost" data-act="go" data-to="#/">Voltar</button></div>
  <h2>Nova música</h2>
  <div class="tabs" role="radiogroup" aria-label="Instrumento">
    <label><input type="radio" name="inst" value="violao" checked><span>Violão</span></label>
    <label><input type="radio" name="inst" value="guitarra"><span>Guitarra</span></label></div><br>
  <div class="tabs" role="radiogroup" aria-label="Origem">
    <label><input type="radio" name="mode" value="chat" checked><span>Do chat com a IA</span></label>
    <label><input type="radio" name="mode" value="cola"><span>Colar cifras</span></label>
    <label><input type="radio" name="mode" value="busca"><span>Com chave de API</span></label></div>
  <label class="field"><span>Música e artista</span><input type="text" id="q" placeholder="Ex.: Trem-Bala, Ana Vilela"></label>
  <div id="chat">
    <p class="mute">Passo 1: copie o pedido e cole no chat do Gemini (ou de qualquer IA). Passo 2: copie a resposta e cole abaixo.</p>
    <button data-act="copyprompt">Copiar pedido para a IA</button>
    <label class="field"><span>Resposta da IA</span><textarea id="t-c"></textarea></label>
    <button class="primary" data-act="chatimp">Importar</button>
  </div>
  <div id="paste" hidden>
    <p class="mute">Copie a cifra do site e cole aqui. O formato com os acordes em cima da letra funciona, desde que você copie o texto da cifra e não um print. Preencha uma ou as duas versões.</p>
    <label class="field"><span>Versão simplificada</span><textarea id="t-s"></textarea></label>
    <label class="field"><span>Versão avançada</span><textarea id="t-a"></textarea></label>
  </div>
  <div class="row" id="btns" hidden><button class="primary" id="go" data-act="gen">Gerar com a chave de API</button>
  <button id="off" data-act="off" hidden>Gerar sem IA (grátis, offline)</button></div>
  <p class="mute" id="offnote" hidden>“Sem IA” usa regras simples: tira extensões e inversões dos acordes da avançada. Não precisa de chave nem de internet.</p>
  <div id="st" class="status" hidden></div>`;
  const setMode = () => {
    const m = document.querySelector('[name=mode]:checked').value;
    $('#chat').hidden = m !== 'chat'; $('#paste').hidden = m !== 'cola'; $('#btns').hidden = m === 'chat';
    $('#off').hidden = m !== 'cola'; $('#offnote').hidden = m !== 'cola';
  };
  document.querySelectorAll('[name=mode]').forEach(r => r.onchange = setMode);
}

function chatImport() {
  const st = $('#st'); st.hidden = false; st.className = 'status err';
  const {meta, secs} = parseChat($('#t-c').value);
  if (!secs.length) { st.textContent = 'Não encontrei trechos. A resposta precisa ter linhas como “== Intro ==” e “--- simples ---”. Use o botão “Copiar pedido para a IA”.'; return; }
  const title = meta.titulo || $('#q').value.trim();
  if (!title) { st.textContent = 'Faltou o título. Digite a música e artista no campo acima.'; return; }
  const s = upsert({title, artist: meta.artista, key: meta.tom, instrument: meta.instrumento || document.querySelector('[name=inst]:checked').value}, secs);
  saveDb(); nav('#/song/' + s.id);
}

async function gen() {
  const st = $('#st'), btn = $('#go');
  const mode = document.querySelector('[name=mode]:checked').value;
  const inst = document.querySelector('[name=inst]:checked').value;
  const q = $('#q').value.trim(), ts = $('#t-s').value.trim(), ta = $('#t-a').value.trim();
  const say = (m, err) => { st.hidden = false; st.className = 'status' + (err ? ' err' : ''); st.textContent = m; };
  if (!q) return say('Digite o nome da música.', true);
  if (mode === 'cola' && !ts && !ta) return say('Cole pelo menos uma das versões.', true);
  btn.disabled = true;
  say(mode === 'busca' ? (canSearch() ? 'Buscando as cifras e montando as três versões. Isso leva de 30 a 90 segundos.' : 'Montando as três versões de memória, sem buscar na internet. Confira os acordes.') : 'Montando as três versões a partir do que você colou.');
  const inst2 = inst === 'guitarra' ? 'guitarra' : 'violão';
  const prompt = mode === 'busca' && !canSearch()
    ? `Música: ${q}\nInstrumento: ${inst2}\nVocê não tem acesso à internet. Use o que conhece da cifra desta música e gere as três versões (simples, intermediária, avançada), trecho por trecho. Não invente letra: se não tiver certeza, deixe só os acordes.`
    : mode === 'busca'
    ? `Música: ${q}\nInstrumento: ${inst2}\nUse a busca na web para encontrar a cifra em sites de cifras (Cifra Club e similares): uma versão simplificada e uma versão completa/avançada. Depois gere as três versões (simples, intermediária, avançada), trecho por trecho.`
    : `Música: ${q}\nInstrumento: ${inst2}\nCIFRA SIMPLIFICADA (pode estar vazia):\n${ts || '(vazia)'}\n\nCIFRA AVANÇADA (pode estar vazia):\n${ta || '(vazia)'}\n\nAlinhe as duas por trechos e gere as três versões. Se uma estiver vazia, derive a partir da outra.`;
  try {
    const r = await ask(prompt, mode === 'busca' && canSearch(), say);
    if (!r.sections?.length) throw new Error('Nenhum trecho foi retornado.');
    const song = {id: Date.now().toString(36), title: r.title || q, artist: r.artist || '', key: r.key || '', instrument: inst, created: Date.now(),
      sections: r.sections.map(s => ({name: s.name || 'Trecho', sel: 'intermediate', v: {simple: s.simple || s.intermediate || '', intermediate: s.intermediate || '', advanced: s.advanced || s.intermediate || ''}}))};
    db.songs.unshift(song); saveDb(); nav('#/song/' + song.id);
  } catch (e) { say(e.message, true); btn.disabled = false; }
}

function songView(id) {
  const s = find(id);
  if (!s) return nav('#/');
  app.innerHTML = `
  <div class="bar"><button class="ghost" data-act="go" data-to="#/">Voltar</button>
    <div class="row"><button data-act="fs" data-d="-1" aria-label="Diminuir letra">A−</button><button data-act="fs" data-d="1" aria-label="Aumentar letra">A+</button></div></div>
  <h1>${esc(s.title)}</h1>
  <p class="mute">${esc(s.artist)}${s.key ? ' · tom ' + esc(s.key) : ''} · ${s.instrument === 'guitarra' ? 'Guitarra' : 'Violão'}</p>
  <div class="row"><span class="mute">Todos os trechos:</span>${KEYS.map(k => `<button data-act="all" data-k="${k}" style="border-color:var(${VAR[k]})">${L[k]}</button>`).join('')}</div>
  ${s.sections.map((x, i) => `
  <article class="sec" style="--vc:var(${VAR[x.sel]})">
    <header><h3>${esc(x.name)}</h3>
      <div class="seg" role="group" aria-label="Versão de ${esc(x.name)}">${KEYS.map(k => `<button style="--c:var(${VAR[k]})" data-act="sel" data-i="${i}" data-k="${k}" aria-pressed="${x.sel === k}">${L[k]}</button>`).join('')}</div></header>
    ${editing === i ? `<textarea data-i="${i}" spellcheck="false">${esc(x.v[x.sel])}</textarea>` : `<pre>${fmt(x.v[x.sel])}</pre>`}
    <div class="row" style="margin-top:6px"><button class="ghost" data-act="edit" data-i="${i}">${editing === i ? 'Pronto' : 'Editar este trecho'}</button>${x.edited?.[x.sel] && x.src ? `<button class="ghost" data-act="reset" data-i="${i}">Voltar ao original</button>` : ''}</div>
  </article>`).join('')}
  <p><button class="ghost danger" data-act="del" data-id="${s.id}">Excluir música</button></p>`;
}

function cfgView() {
  const g = cfg.provider === 'gemini';
  app.innerHTML = `
  <div class="bar"><button class="ghost" data-act="go" data-to="#/">Voltar</button></div>
  <h2>Configurações</h2>
  <label class="field"><span>Provedor de IA</span><select id="p"><option value="gemini" ${g ? 'selected' : ''}>Google Gemini (tem plano gratuito)</option><option value="anthropic" ${g ? '' : 'selected'}>Anthropic Claude (pago)</option></select></label>
  <div id="pg" ${g ? '' : 'hidden'}>
    <label class="field"><span>Chave da API do Gemini</span><input type="password" id="gk" value="${esc(cfg.gkey)}" autocomplete="off" placeholder="AIza..."></label>
    <p class="mute">Crie de graça em aistudio.google.com/apikey. No plano gratuito não há busca na web: a opção “Buscar na internet” usa o que a IA já conhece, então confira os acordes. Colar cifras funciona melhor.</p>
    <label class="field"><span>Modelo</span><input type="text" id="gm" value="${esc(cfg.gmodel)}"></label>
    <label class="row"><input type="checkbox" id="gs" ${cfg.gsearch ? 'checked' : ''}> <span>Minha chave tem busca do Google ativada (plano pago)</span></label>
  </div>
  <div id="pa" ${g ? 'hidden' : ''}>
    <label class="field"><span>Chave da API da Anthropic</span><input type="password" id="k" value="${esc(cfg.key)}" autocomplete="off" placeholder="sk-ant-..."></label>
    <p class="mute">API paga, separada da assinatura do Claude. Crie em console.anthropic.com.</p>
    <label class="field"><span>Modelo</span><input type="text" id="m" value="${esc(cfg.model)}"></label>
  </div>
  <h3 style="margin-top:32px">Planilha do Google (opcional)</h3>
  <p class="mute">Peça ao Gemini para criar a planilha, publique-a como CSV e cole o link aqui. Todo trecho novo que o Gemini acrescentar aparece no app ao abrir ou tocar em Sincronizar (o Google pode levar alguns minutos para atualizar o link publicado). Passo a passo no README.</p>
  <button data-act="copysheet">Copiar pedido para criar a planilha</button>
  <label class="field"><span>Link CSV publicado</span><input type="text" id="sh" value="${esc(cfg.sheet)}" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv"></label>
  <p class="mute">As chaves ficam só neste aparelho e são enviadas apenas ao provedor escolhido.</p>
  <button class="primary" data-act="savecfg">Salvar</button>
  <h3 style="margin-top:32px">Backup</h3>
  <p class="mute">Suas músicas ficam salvas no navegador deste aparelho. Exporte um arquivo para guardar ou levar para outro aparelho.</p>
  <div class="row"><button data-act="export">Exportar músicas</button><button data-act="import">Importar músicas</button></div>
  <input type="file" id="f" accept="application/json" hidden>`;
  $('#p').onchange = e => { $('#pg').hidden = e.target.value !== 'gemini'; $('#pa').hidden = e.target.value === 'gemini'; };
  $('#f').onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text());
      const ids = new Set(db.songs.map(x => x.id));
      d.songs.forEach(x => { if (!ids.has(x.id)) db.songs.push(x); });
      saveDb(); alert('Músicas importadas.'); nav('#/');
    } catch { alert('Esse arquivo não parece um backup válido.'); }
  };
}

/* ---------- eventos ---------- */
document.addEventListener('input', e => {
  if (e.target.matches('.sec textarea')) {
    const s = find(location.hash.split('/')[2]), x = s.sections[+e.target.dataset.i];
    x.v[x.sel] = e.target.value; (x.edited = x.edited || {})[x.sel] = true; saveDb();
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset, id = location.hash.split('/')[2], s = find(id);
  switch (d.act) {
    case 'go': editing = null; nav(d.to); break;
    case 'gen': gen(); break;
    case 'off': genOffline(); break;
    case 'chatimp': chatImport(); break;
    case 'copyprompt': copyText(promptChat()); break;
    case 'copysheet': copyText(promptSheet()); break;
    case 'sync': syncSheet(false); break;
    case 'reset': { const x = s.sections[+d.i]; x.v[x.sel] = x.src[x.sel]; x.edited[x.sel] = false; saveDb(); songView(id); break; }
    case 'sel': s.sections[+d.i].sel = d.k; saveDb(); songView(id); break;
    case 'all': s.sections.forEach(x => x.sel = d.k); saveDb(); songView(id); break;
    case 'edit': editing = editing === +d.i ? null : +d.i; songView(id); break;
    case 'fs': cfg.fs = Math.min(26, Math.max(10, cfg.fs + 2 * +d.d)); saveCfg(); document.documentElement.style.setProperty('--fs', cfg.fs + 'px'); break;
    case 'del': if (confirm('Excluir esta música?')) { db.songs = db.songs.filter(x => x.id !== d.id); saveDb(); nav('#/'); } break;
    case 'savecfg': cfg.provider = $('#p').value; cfg.key = $('#k').value.trim(); cfg.model = $('#m').value.trim() || 'claude-sonnet-4-6'; cfg.gkey = $('#gk').value.trim(); cfg.gmodel = $('#gm').value.trim() || 'gemini-flash-latest'; cfg.gsearch = $('#gs').checked; cfg.sheet = $('#sh').value.trim(); saveCfg(); nav('#/'); syncSheet(false); break;
    case 'export': { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); a.download = 'meio-termo-backup.json'; a.click(); break; }
    case 'import': $('#f').click(); break;
  }
});
function route() {
  const [, p, id] = location.hash.split('/');
  editing = null;
  if (p === 'new') newView(); else if (p === 'song') songView(id); else if (p === 'cfg') cfgView(); else home();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
syncSheet(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
